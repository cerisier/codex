name: Windows Rust fixture diagnostic

on:
  push:
    branches: [codex/voice-windows-diagnostic]
    paths: [.github/workflows/windows-rust-fixture-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        revision: [before, after]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.revision == 'before' && 'e74e48d3003401d0718688d643c4bc79eebf35e2' || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-msvc
          cache-scope: rust-fixture-diagnostic
      - name: Compile and run the existing separator test with strict output checking
        id: test
        continue-on-error: true
        shell: pwsh
        run: |
          bazel --output_base=D:/o test --config=ci-windows-msvc --compilation_mode=opt `
            --platforms=//:local_windows_msvc --host_platform=//:local_windows_msvc `
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=1 `
            "--action_env=SystemRoot=$env:SystemRoot" "--host_action_env=SystemRoot=$env:SystemRoot" `
            "--action_env=PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE" `
            "--host_action_env=PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE" `
            --jobs=4 --local_resources=memory=6000 --test_output=all `
            --test_filter=windows_include_metadata_redacts_both_root_spellings `
            @rules_rust//cargo/private/cargo_build_script_runner:test 2>&1 | Tee-Object fixture-test.log
          exit $LASTEXITCODE
      - name: Check the expected before and after results
        shell: pwsh
        env:
          REVISION: ${{ matrix.revision }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          if ($env:REVISION -eq 'before') {
            if ($env:TEST_OUTCOME -ne 'failure') { throw 'Baseline unexpectedly passed' }
            if (-not (Select-String -Path fixture-test.log -SimpleMatch 'embeds the absolute working directory')) {
              throw 'Baseline failed for a different reason'
            }
          } elseif ($env:TEST_OUTCOME -ne 'success') {
            throw 'Fixed test did not compile and pass'
          }
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: rust-fixture-${{ matrix.revision }}
          path: fixture-test.log

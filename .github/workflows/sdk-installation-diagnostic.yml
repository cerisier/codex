name: SDK installation diagnostic

on:
  push:
    branches: [codex/voice-windows-diagnostic]
    paths: [.github/workflows/sdk-installation-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-sdk-installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: 6771e8fe0bf1652fd5c860d99a2903a90c78ca47

      - name: Test the installed Python SDK and its default runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/codex-python-sdk-home \
            -e UV_LINK_MODE=copy \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}/sdk/python" \
            python:3.12-slim \
            sh -euxc '
              python -m venv /tmp/build
              /tmp/build/bin/python -m pip install --only-binary=:all: --require-hashes -r tests/requirements-uv.txt
              /tmp/build/bin/uv build --wheel --out-dir /tmp/dist
              python -m venv /tmp/installed
              /tmp/build/bin/uv pip install --python /tmp/installed/bin/python /tmp/dist/*.whl
              env -u PYTHONPATH -u CODEX_EXEC_PATH /tmp/installed/bin/python tests/installed_sdk_smoke.py
            '


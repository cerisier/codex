name: Linux voice diagnostic

on:
  push:
    branches: [codex/voice-windows-diagnostic]
    paths:
      - '.github/workflows/voice-linux-diagnostic.yml'
      - '.github/scripts/diagnose-voice-linux.py'
      - 'third_party/voice/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    if: github.repository == 'cerisier/codex'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            cpu: x86_64
          - runner: ubuntu-24.04-arm
            cpu: aarch64
    env:
      VOICE_CPU: ${{ matrix.cpu }}
      VOICE_TARGET: ${{ matrix.cpu }}-unknown-linux-gnu
      CARGO_BUILD_JOBS: '4'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      STABLE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: meta/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.30.0
          output-base: /tmp/voice-bazel
      - name: Install existing Cargo native prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential binutils pkg-config libcap-dev libasound2-dev cmake ninja-build
          rustup toolchain install 1.95.0 --profile minimal
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
      - name: Build SDK and runtime
        id: native
        run: python .github/scripts/diagnose-voice-linux.py build
      - name: Build Bazel helper
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: python .github/scripts/diagnose-voice-linux.py helper
      - name: Save Bazel evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: voice-linux-${{ matrix.cpu }}-bazel
          path: voice-linux-diagnostic/
          if-no-files-found: warn
      - name: Stage and configure Cargo SDK
        id: sdk
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          runtime="bazel-bin/third_party/voice/native_runtime_linux_$VOICE_CPU"
          python third_party/voice/cargo_ci.py stage --sdk "${runtime}_sdk" --runtime "$runtime" --output "$RUNNER_TEMP/cargo-voice" --target "$VOICE_TARGET"
          python third_party/voice/cargo_ci.py configure --root "$RUNNER_TEMP/cargo-voice" --target "$VOICE_TARGET"
      - name: Build Cargo helper and exercise both relocated packages
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: python .github/scripts/diagnose-voice-linux.py cargo
      - name: Save all evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: voice-linux-${{ matrix.cpu }}
          path: voice-linux-diagnostic/
          if-no-files-found: warn

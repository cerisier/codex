name: Windows voice toolchain diagnostic

on:
  push:
    branches: [codex/voice-windows-diagnostic]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-windows-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: github.repository == 'cerisier/codex'
    runs-on: windows-2025
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        mode: [current, before-removal, restored-msvc]
    env:
      DIAGNOSTIC_MODE: ${{ matrix.mode }}
      BAZELISK_HOME: C:/v/bazelisk
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Match the existing CI short temporary paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/v/tmp | Out-Null
          'TEMP=C:/v/tmp' >> $env:GITHUB_ENV
          'TMP=C:/v/tmp' >> $env:GITHUB_ENV
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: meta/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.30.0
          output-base: C:/v/o
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - name: Select comparison configuration
        shell: pwsh
        run: python .github/scripts/diagnose-voice-windows.py configure
      - name: Download pinned public Cygwin archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pin = (Get-Content -Raw .github/scripts/voice-cygwin-snapshot.json | ConvertFrom-Json).archive
          $directory = Join-Path $env:RUNNER_TEMP 'voice-cygwin'
          New-Item -ItemType Directory -Path $directory | Out-Null
          gh release download $pin.tag --repo openai/codex --pattern $pin.name --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download the pinned public build inputs' }
          "VOICE_CYGWIN_ARCHIVE=$(Join-Path $directory $pin.name)" >> $env:GITHUB_ENV
      - name: Provision the existing voice recipe inputs
        shell: pwsh
        run: |
          & ./.github/scripts/setup-voice-windows.ps1 -Target x86_64-pc-windows-msvc -SnapshotArchive $env:VOICE_CYGWIN_ARCHIVE
          if ($LASTEXITCODE -ne 0) { throw 'Voice tool provisioning failed' }
      - name: Analyze and build only the native voice SDK and runtime
        shell: pwsh
        run: python .github/scripts/diagnose-voice-windows.py build
      - name: Upload diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: voice-windows-${{ matrix.mode }}
          if-no-files-found: warn
          path: |
            voice-diagnostic/
            ${{ runner.temp }}/voice-windows-build-tools/evidence/
